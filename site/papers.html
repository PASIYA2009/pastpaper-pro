<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Past Papers - PastPaper Pro</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo">PastPaper <span>Pro</span></div><nav><a href="index.html">Home</a><a href="papers.html">Papers</a></nav></header><section class="container page"><div class="page-title"><span class="badge">Archive</span><h1>Past Papers</h1><p>Filter the archive and open the paper you need.</p></div><form class="filters" method="get"><input name="q" placeholder="Search papers..."><select name="exam"><option value="">All Exams</option><option value="OL">O/L</option><option value="AL">A/L</option></select><select name="subject"><option value="">All Subjects</option></select><select name="year"><option value="">All Years</option></select><button class="btn" type="submit">Search</button><a class="btn btn-outline" href="papers.html">Reset</a></form><div id="papers" class="grid"><div class="empty">Loading papers...</div></div></section><footer class="footer">© 2026 PastPaper Pro</footer><script src="app.js"></script><script>getPapers().then(ps=>{const s=document.querySelector('[name=subject]'),y=document.querySelector('[name=year]');[...new Set(ps.map(p=>p.subject))].sort().forEach(v=>s.insertAdjacentHTML('beforeend',`<option>${v.replace(/</g,'&lt;')}</option>`));[...new Set(ps.map(p=>p.year))].sort((a,b)=>b-a).forEach(v=>y.insertAdjacentHTML('beforeend',`<option>${v}</option>`));}).catch(()=>{});</script></body></html>
